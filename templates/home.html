<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d4eaf7;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #0d4f79;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .logout {
            background-color: #14689a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-bar {
            width: 30%;
            margin: 20px auto;
        }

        .add-button {
            background-color: #0d4f79;
            color: white;
            border: none;
            width: 230px;
            padding: 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px;
            margin-left: 2px;
        }

        .form-container {
            margin-left: 20px;
        }

        .form-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .form-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: calc(25% - 20px); /* 4 cards per row with gap */
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Align content properly */
            position: relative; /* For positioning the 3-dots icon */
        }

        .form-card:hover {
            transform: scale(1.05);
        }

        .form-card h3 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #0d4f79;
        }

        .form-card p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }

        .form-card .created-at {
            font-size: 12px;
            color: #888;
            margin-top: auto; /* Push to the bottom */
        }

        /* 3-Dots Icon and Dropdown Menu */
        .card-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }

        .card-actions .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .card-actions .dropdown-menu.show {
            display: block;
        }

        .card-actions .dropdown-item {
            padding: 8px 16px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .card-actions .dropdown-item:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>IAS - Client Satisfaction Evaluation and Management System</h1>
        <form action="{{ url_for('logout') }}" method="POST">
            <button type="submit" class="logout">Logout</button>
        </form>
    </div>

    <main>
        <div class="search-bar">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Search forms...">
                <button class="btn btn-primary">Search</button>
            </div>
        </div>

        <!-- Add Form Button -->
        <div class="form-container">
            <a href="{{ url_for('questions') }}">
                <button class="add-button">Add Form</button>
            </a>

            <!-- Display List of Saved Forms as Cards -->
            <div class="form-list">
                {% for form in saved_forms %}
                <div class="form-card">
                    <!-- 3-Dots Icon for Actions -->
                    <div class="card-actions">
                        <i class="bi bi-three-dots-vertical" onclick="toggleDropdown(this)"></i>
                        <div class="dropdown-menu">
                            <div class="dropdown-item" onclick="copyForm({{ form.form_id }})">Copy</div>
                            <div class="dropdown-item" onclick="deleteForm({{ form.form_id }})">Delete</div>
                        </div>
                    </div>

                    <!-- Form Content -->
                    <h3>{{ form.form_title }}</h3>
                    <p>{{ form.form_description }}</p>
                    <p class="created-at">Created: {{ form.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>

<script>
    // Function to toggle the dropdown menu
    function toggleDropdown(icon) {
        const dropdownMenu = icon.nextElementSibling;
        dropdownMenu.classList.toggle('show');
    }

    // Close dropdown when clicking outside
    window.onclick = function(event) {
        if (!event.target.matches('.bi-three-dots-vertical')) {
            const dropdowns = document.querySelectorAll('.dropdown-menu');
            dropdowns.forEach(dropdown => {
                if (dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            });
        }
    };

    // Function to copy a form
    function copyForm(formId) {
        fetch(`/copy_form/${formId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                window.location.reload(); // Refresh the page to show the copied form
            } else {
                alert(data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while copying the form.');
        });
    }

    // Function to delete a form
    function deleteForm(formId) {
        if (confirm('Are you sure you want to delete this form?')) {
            fetch(`/delete_form/${formId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    window.location.reload(); // Refresh the page to reflect the deletion
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while deleting the form.');
            });
        }
    }
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
