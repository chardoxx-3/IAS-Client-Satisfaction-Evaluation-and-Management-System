<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAS - Client Survey</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>IAS - Client Satisfaction Survey</h1>
    </header>
    <main>
        <form action="{{ url_for('client.submit_survey') }}" method="POST">
            <div class="question">
                <label>How satisfied are you with our service?</label>
                <input type="text" name="satisfaction" required>
            </div>
            <div class="question">
                <label>Any suggestions for improvement?</label>
                <textarea name="suggestions"></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 IAS - Client Satisfaction Evaluation and Management System</p>
    </footer>
</body>
</html>
